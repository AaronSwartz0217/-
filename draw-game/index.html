<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>求职卡牌策略 · 杭州十年百万</title>
<script>
  // 尽早应用主题（与主站一致），避免加载闪烁
  (function () {
    var saved = localStorage.getItem('theme');
    var dark = saved ? saved === 'dark'
      : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>
<style>
:root {
  --bg: #fafafa;
  --surface: #fff;
  --text: #1a1a1a;
  --text-soft: #6b6b6b;
  --text-faint: #9a9a9a;
  --border: #e6e6e6;
  --accent: #1a1a1a;
  --accent-text: #fff;
  --danger: #d64545;
  --danger-soft: #fbeaea;
  --safe: #2f8a5b;
  --safe-soft: #eaf5ef;
  --shadow: rgba(0,0,0,.10);
  --radius: 12px;
  --level-N: #9a9a9a;
  --level-R: #4A90D9;
  --level-SR: #9B59B6;
  --level-SSR: #F39C12;
}
html[data-theme="dark"] {
  --bg: #16181d;
  --surface: #1e2127;
  --text: #e8e8ea;
  --text-soft: #a8abb2;
  --text-faint: #71757e;
  --border: #2f333b;
  --accent: #e8e8ea;
  --accent-text: #16181d;
  --danger: #ff6b6b;
  --danger-soft: #3a2222;
  --safe: #5cc98a;
  --safe-soft: #1e2e26;
  --shadow: rgba(0,0,0,.5);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  padding: 16px;
  transition: background .25s, color .25s;
}
.wrap {
  max-width: 880px;
  margin: 0 auto;
}

/* 顶栏 */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.topbar .title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: .5px;
}
.topbar .sub {
  font-size: 12px;
  color: var(--text-faint);
  margin-top: 2px;
}
.icon-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 12px;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  transition: border-color .15s, background .15s;
}
.icon-btn:hover { border-color: var(--accent); }

/* 状态栏 */
.statusbar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: 0 1px 3px var(--shadow);
}
.stat {
  text-align: center;
}
.stat .label {
  font-size: 11px;
  color: var(--text-faint);
  margin-bottom: 4px;
  letter-spacing: .5px;
}
.stat .value {
  font-size: 20px;
  font-weight: 700;
}
.stat .value.warn { color: var(--danger); }
.stat .value.good { color: var(--safe); }
.progress {
  height: 4px;
  background: var(--border);
  border-radius: 4px;
  margin-top: 8px;
  overflow: hidden;
}
.progress > i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--level-R), var(--level-SSR));
  border-radius: 4px;
  transition: width .3s;
}

/* 通用卡片 */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: 0 1px 3px var(--shadow);
  margin-top: 12px;
}
.section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-soft);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title .tag {
  font-size: 11px;
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 2px 8px;
  border-radius: 10px;
  color: var(--text-faint);
}

/* 当前工作 */
.job-card .job-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}
.job-name {
  font-size: 22px;
  font-weight: 700;
}
.job-meta {
  font-size: 13px;
  color: var(--text-soft);
}
.job-rows {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 8px 16px;
  margin-top: 12px;
  font-size: 13px;
}
.job-rows .k { color: var(--text-faint); }
.job-rows .v { color: var(--text); font-weight: 600; }
.empty-hint {
  color: var(--text-faint);
  font-size: 14px;
  text-align: center;
  padding: 8px 0;
}

/* 等级徽章 */
.lvl {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 8px;
  color: #fff;
  letter-spacing: .5px;
}
.lvl-N { background: var(--level-N); }
.lvl-R { background: var(--level-R); }
.lvl-SR { background: var(--level-SR); }
.lvl-SSR { background: var(--level-SSR); }

/* 操作按钮 */
.actions {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 12px;
}
@media (min-width: 560px) {
  .actions { grid-template-columns: repeat(5, 1fr); }
}
.btn {
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  padding: 12px 8px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: transform .08s, background .15s, border-color .15s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.btn:hover { border-color: var(--accent); }
.btn:active { transform: scale(.97); }
.btn .btn-sub { font-size: 11px; font-weight: 400; color: var(--text-faint); }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.btn.primary .btn-sub { color: var(--accent-text); opacity: .7; }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* 抽卡结果区 */
.draw-result {
  margin-top: 12px;
}
.draw-card-big {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 14px;
}
.big-card {
  position: relative;
  border-radius: 14px;
  padding: 22px 18px;
  background: var(--surface);
  border: 2px solid var(--border);
  overflow: hidden;
}
.big-card .lvl-strip {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 6px;
}
.big-card .row-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}
.big-card .row-top .lvl { font-size: 13px; padding: 4px 12px; }
.big-card .row-top .hire-rate {
  font-size: 12px;
  color: var(--text-soft);
}
.big-card .job-name-big {
  font-size: 28px;
  font-weight: 800;
  margin-bottom: 6px;
}
.big-card .job-district { font-size: 14px; color: var(--text-soft); margin-bottom: 14px; }
.big-card .salary {
  font-size: 18px;
  font-weight: 700;
  color: var(--level-SSR);
}
.big-card .salary .unit { font-size: 12px; color: var(--text-faint); font-weight: 400; }
.big-card.n-card .job-name-big { color: var(--text-faint); }
.draw-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

/* 十连抽网格 */
.ten-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin: 10px 0 16px;
}
@media (min-width: 480px) { .ten-grid { grid-template-columns: repeat(5, 1fr); } }
.mini-card {
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 10px 6px;
  text-align: center;
  cursor: pointer;
  background: var(--bg);
  transition: transform .1s, border-color .15s, opacity .2s;
  position: relative;
  min-height: 92px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 4px;
}
.mini-card:hover { border-color: var(--accent); }
.mini-card.selected { border-color: var(--level-SSR); box-shadow: 0 0 0 2px var(--level-SSR); }
.mini-card.locked { opacity: .35; cursor: default; }
.mini-card.locked:hover { border-color: var(--border); }
.mini-card .mc-lvl { font-size: 10px; }
.mini-card .mc-name { font-size: 13px; font-weight: 700; }
.mini-card .mc-dist { font-size: 10px; color: var(--text-faint); }
.mini-card .mc-result {
  font-size: 10px;
  margin-top: 4px;
  font-weight: 700;
}
.mini-card .mc-result.ok { color: var(--safe); }
.mini-card .mc-result.no { color: var(--danger); }

/* 事件日志 */
.log-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 13px;
  max-height: 220px;
  overflow-y: auto;
}
.log-item {
  padding: 8px 10px;
  border-radius: 8px;
  background: var(--bg);
  border: 1px solid var(--border);
  line-height: 1.45;
}
.log-item .m { color: var(--text-faint); font-size: 11px; margin-right: 6px; }
.log-item.pos { border-left: 3px solid var(--safe); }
.log-item.neg { border-left: 3px solid var(--danger); }
.log-item.sys { border-left: 3px solid var(--level-R); }
.log-empty { color: var(--text-faint); font-size: 13px; text-align: center; padding: 10px 0; }

/* 弹窗 */
.modal-mask {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  z-index: 50;
}
.modal-mask.show { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  width: 100%;
  max-width: 620px;
  max-height: 88vh;
  overflow-y: auto;
  padding: 18px;
  box-shadow: 0 10px 40px rgba(0,0,0,.3);
}
.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}
.modal-head h3 { font-size: 17px; }
.modal-close {
  background: none;
  border: 1px solid var(--border);
  color: var(--text);
  width: 30px; height: 30px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
}

/* 图鉴 */
.dex-group { margin-bottom: 16px; }
.dex-group h4 {
  font-size: 14px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.dex-group .prog {
  font-size: 12px;
  color: var(--text-faint);
  font-weight: 400;
}
.dex-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 8px;
}
.dex-cell {
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 6px;
  text-align: center;
  font-size: 12px;
  background: var(--bg);
}
.dex-cell.got { background: var(--surface); }
.dex-cell.got .dn { font-weight: 700; }
.dex-cell.lock .dn { color: var(--text-faint); }
.dex-cell .dn { font-size: 12px; }
.dex-cell .dd { font-size: 10px; color: var(--text-faint); margin-top: 2px; }

/* 设置开关 */
.switch-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.switch-row:last-child { border-bottom: none; }
.switch-row .lbl { font-size: 14px; }
.switch-row .desc { font-size: 12px; color: var(--text-faint); margin-top: 2px; }
.switch {
  position: relative;
  width: 44px; height: 24px;
  background: var(--border);
  border-radius: 12px;
  cursor: pointer;
  transition: background .2s;
  flex-shrink: 0;
}
.switch.on { background: var(--safe); }
.switch::after {
  content: "";
  position: absolute;
  top: 2px; left: 2px;
  width: 20px; height: 20px;
  background: #fff;
  border-radius: 50%;
  transition: transform .2s;
}
.switch.on::after { transform: translateX(20px); }

/* 结局 */
.end-screen { text-align: center; padding: 14px 6px; }
.end-screen .end-title {
  font-size: 26px;
  font-weight: 800;
  margin-bottom: 10px;
}
.end-screen.win .end-title { color: var(--level-SSR); }
.end-screen.fail .end-title { color: var(--danger); }
.end-screen.bankrupt .end-title { color: var(--danger); }
.end-stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin: 18px 0;
  text-align: left;
}
.end-stats .es {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
}
.end-stats .es .k { font-size: 11px; color: var(--text-faint); }
.end-stats .es .v { font-size: 16px; font-weight: 700; margin-top: 2px; }

/* toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translateX(-50%) translateY(20px);
  background: var(--accent);
  color: var(--accent-text);
  padding: 10px 18px;
  border-radius: 22px;
  font-size: 14px;
  font-weight: 600;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
  z-index: 100;
  max-width: 90vw;
  text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.foot {
  text-align: center;
  color: var(--text-faint);
  font-size: 12px;
  margin-top: 20px;
  line-height: 1.6;
}
.foot a { color: var(--text-soft); }
.overlay-hint { font-size: 12px; color: var(--text-faint); text-align: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="title">求职卡牌策略 · 杭州十年百万</div>
      <div class="sub">在杭州工作 10 年（120 个月），累计净资产达到 100 万元</div>
    </div>
    <button class="icon-btn" id="themeToggle">夜间模式</button>
  </div>

  <!-- 状态栏 -->
  <div class="statusbar">
    <div class="stat">
      <div class="label">月份</div>
      <div class="value" id="stMonth">1 / 120</div>
    </div>
    <div class="stat">
      <div class="label">净资产（元）</div>
      <div class="value" id="stNet">15,000</div>
      <div class="progress"><i id="stBar" style="width:1.5%"></i></div>
    </div>
    <div class="stat">
      <div class="label">抽卡次数</div>
      <div class="value" id="stDraw">0</div>
    </div>
  </div>

  <!-- 当前工作 -->
  <div class="card job-card">
    <div class="section-title">当前工作 <span class="tag" id="jobTag">无业</span></div>
    <div id="jobBody"><div class="empty-hint">尚未入职，请抽卡获取工作机会</div></div>
  </div>

  <!-- 操作按钮 -->
  <div class="actions">
    <button class="btn primary" id="btnSingle"><span>单抽</span><span class="btn-sub">消耗 1 次</span></button>
    <button class="btn" id="btnTen"><span>十连抽</span><span class="btn-sub">消耗 10 次</span></button>
    <button class="btn" id="btnNext"><span>下月结算</span><span class="btn-sub">+1 抽卡</span></button>
    <button class="btn" id="btnDex"><span>图鉴</span><span class="btn-sub" id="dexCount">0 / 28</span></button>
    <button class="btn danger" id="btnReset"><span>重新开始</span><span class="btn-sub">清空存档</span></button>
  </div>

  <!-- 抽卡结果 -->
  <div class="card draw-result" id="drawResultCard" style="display:none">
    <div class="section-title">抽卡结果</div>
    <div id="drawResultBody"></div>
  </div>

  <!-- 事件日志 -->
  <div class="card">
    <div class="section-title">事件日志 <span class="tag" id="logTag">最近 10 条</span></div>
    <div class="log-list" id="logList"></div>
  </div>

  <div class="foot">
    目标 1,000,000 元 · 破产线 -50,000 元 · 数据自动保存到本地浏览器<br>
    <a href="../index.html">返回主站</a>
  </div>
</div>

<!-- 十连抽弹窗 -->
<div class="modal-mask" id="tenModal">
  <div class="modal">
    <div class="modal-head">
      <h3>十连抽结果（10 选 1）</h3>
      <button class="modal-close" id="tenClose">×</button>
    </div>
    <div id="tenBody"></div>
    <div class="draw-actions" id="tenActions">
      <button class="btn primary" id="tenConfirm" disabled><span>录取选中卡牌</span></button>
      <button class="btn" id="tenDecline"><span>全部放弃</span></button>
    </div>
    <div class="overlay-hint" id="tenHint">点击任意卡牌选中后录取</div>
  </div>
</div>

<!-- 图鉴弹窗 -->
<div class="modal-mask" id="dexModal">
  <div class="modal">
    <div class="modal-head">
      <h3>工作图鉴</h3>
      <button class="modal-close" id="dexClose">×</button>
    </div>
    <div id="dexBody"></div>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="modal-mask" id="setModal">
  <div class="modal">
    <div class="modal-head">
      <h3>游戏设置</h3>
      <button class="modal-close" id="setClose">×</button>
    </div>
    <div class="switch-row">
      <div>
        <div class="lbl">杭州地区加成</div>
        <div class="desc">SR/SSR 出现率 +5%，R/SR/SSR 录取率提升</div>
      </div>
      <div class="switch on" id="hzSwitch"></div>
    </div>
    <div class="switch-row">
      <div>
        <div class="lbl">夜间模式</div>
        <div class="desc">切换明暗主题</div>
      </div>
      <div class="switch" id="themeSwitch"></div>
    </div>
  </div>
</div>

<!-- 游戏结束弹窗 -->
<div class="modal-mask" id="endModal">
  <div class="modal">
    <div id="endBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ============== 数据定义 ============== */

const JOBS = {
  R: ['外卖骑手','快递员','便利店店员','保安','保洁','餐厅服务员','超市收银员','工厂普工','建筑工人','搬运工'],
  SR: ['程序员','设计师','运营专员','会计','销售经理','行政主管','人力资源专员','市场策划','客服主管','采购专员'],
  SSR: ['产品总监','技术架构师','财务总监','市场部负责人','高级工程师','运营总监','人力资源总监','销售总监']
};

const DISTRICTS = [
  { name:'余杭区', jobs:25, hire:75,  quit:12.5, rentMin:1800, rentMax:3000, living:2500 },
  { name:'西湖区', jobs:21, hire:79,  quit:10.5, rentMin:1800, rentMax:3000, living:3000 },
  { name:'滨江区', jobs:20, hire:80,  quit:10.0, rentMin:2500, rentMax:4000, living:3500 },
  { name:'上城区', jobs:19, hire:81,  quit:9.5,  rentMin:2000, rentMax:3300, living:3000 },
  { name:'萧山区', jobs:19, hire:81,  quit:9.5,  rentMin:2200, rentMax:3500, living:2500 },
  { name:'拱墅区', jobs:12, hire:88,  quit:6.0,  rentMin:1800, rentMax:2700, living:2800 },
  { name:'临平区', jobs:7,  hire:93,  quit:3.5,  rentMin:1000, rentMax:2000, living:2000 },
  { name:'钱塘区', jobs:4,  hire:96,  quit:2.0,  rentMin:1500, rentMax:2500, living:2200 }
];

const SALARY = { R:[2000,6000], SR:[6000,10000], SSR:[10000,20000] };
const LEVEL_NAME = { N:'错过', R:'基层', SR:'中级', SSR:'高级' };

// 意外事件
const EVENTS_POS = [
  { name:'年终奖到账', desc:'金钱 +3,000~8,000',     type:'money', min:3000, max:8000 },
  { name:'项目奖金',   desc:'金钱 +2,000~5,000',     type:'money', min:2000, max:5000 },
  { name:'贵人相助',   desc:'获得 3 次额外抽卡机会', type:'draws', value:3 },
  { name:'副业收入',   desc:'金钱 +1,000~3,000',     type:'money', min:1000, max:3000 }
];
const EVENTS_NEG = [
  { name:'公司拖欠工资', desc:'本月收入减半',         type:'income_half' },
  { name:'招聘诈骗',     desc:'金钱 -2,000',          type:'money', min:-2000, max:-2000 },
  { name:'无故辞退',     desc:'立即失去当前工作',     type:'lose_job' },
  { name:'租房被骗',     desc:'金钱 -3,000',          type:'money', min:-3000, max:-3000 },
  { name:'加班过劳',     desc:'下月收入 -10%（可叠加）', type:'penalty' },
  { name:'HR刁难',        desc:'本月收入归零',         type:'income_zero' }
];

const GOAL = 1000000;
const BANKRUPT = -50000;
const TOTAL_MONTHS = 120;
const STORAGE_KEY = 'jobDrawGame_v3';
const THEME_KEY = 'theme';

/* ============== 状态 ============== */

let state = null;

function defaultState() {
  return {
    drawChances: randInt(10, 200),
    totalDraws: 0,
    currentMonth: 1,
    netWorth: 15000,
    totalIncome: 0,
    currentJob: null,
    collection: { R:[], SR:[], SSR:[] },
    stats: { successCount:0, missCount:0, eventTriggered:0, monthsWorked:0, bestJob:null },
    gameOver: false,
    gameResult: null,
    settings: { hzBoost: true },
    nextIncomePenalty: 0,
    pendingSingle: null,
    pendingTen: null,
    log: []
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      const d = defaultState();
      state = Object.assign({}, d, p);
      state.stats = Object.assign({}, d.stats, p.stats || {});
      state.settings = Object.assign({}, d.settings, p.settings || {});
      state.collection = Object.assign({}, d.collection, p.collection || {});
      if (!Array.isArray(state.log)) state.log = [];
      if (typeof state.drawChances !== 'number') state.drawChances = randInt(10,200);
    } else {
      state = defaultState();
      saveState();
    }
  } catch (e) {
    state = defaultState();
    saveState();
  }
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

/* ============== 工具函数 ============== */

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randFloat(min, max) { return Math.random() * (max - min) + min; }
function fmt(n) { return Math.round(n).toLocaleString('zh-CN'); }
function pct(n) { return (Math.round(n * 10) / 10) + '%'; }
function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

function findDistrict(name) {
  return DISTRICTS.find(d => d.name === name) || DISTRICTS[0];
}

function pickDistrict() {
  const total = DISTRICTS.reduce((s,d) => s + d.jobs, 0);
  let r = Math.random() * total;
  for (const d of DISTRICTS) {
    r -= d.jobs;
    if (r <= 0) return d;
  }
  return DISTRICTS[0];
}

function pickWeighted(arr, weights) {
  const total = weights.reduce((a,b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < arr.length; i++) {
    r -= weights[i];
    if (r <= 0) return arr[i];
  }
  return arr[arr.length - 1];
}

// 出现率（杭州加成后归一化）
function appearanceRates() {
  let n = 20, r = 40, sr = 30, ssr = 10;
  if (state.settings.hzBoost) { sr += 5; ssr += 5; }
  const t = n + r + sr + ssr;
  return { N: n/t, R: r/t, SR: sr/t, SSR: ssr/t };
}

// 实际录取率 = 等级基础录取率(含加成) × (地区录取率 / 100)
function hireRate(level, districtHire) {
  if (level === 'N') return 0;
  let base = { R:80, SR:30, SSR:10 }[level];
  if (state.settings.hzBoost) {
    if (level === 'R') base += 5;
    else if (level === 'SR') base += 8;
    else if (level === 'SSR') base += 10;
  }
  base = Math.min(base, 100);
  return base * (districtHire / 100);
}

function pickLevel() {
  const rates = appearanceRates();
  const r = Math.random();
  let c = 0;
  for (const lv of ['N','R','SR','SSR']) {
    c += rates[lv];
    if (r < c) return lv;
  }
  return 'SSR';
}

function generateCard() {
  const level = pickLevel();
  if (level === 'N') {
    return { level: 'N', name: '错过', district: null, salaryMin: 0, salaryMax: 0, isN: true };
  }
  const district = pickDistrict();
  const list = JOBS[level];
  const name = list[Math.floor(Math.random() * list.length)];
  const [smin, smax] = SALARY[level];
  return {
    level: level,
    name: name,
    district: district.name,
    salaryMin: smin,
    salaryMax: smax,
    districtHire: district.hire,
    districtQuit: district.quit,
    rentMin: district.rentMin,
    rentMax: district.rentMax,
    living: district.living
  };
}

function addLog(text, type) {
  state.log.unshift({ month: state.currentMonth, text: text, type: type || 'sys' });
  if (state.log.length > 30) state.log.length = 30;
}

/* ============== 抽卡 ============== */

function singleDraw() {
  if (state.gameOver) { toast('游戏已结束，请重新开始'); return; }
  if (state.drawChances < 1) { toast('抽卡次数不足'); return; }
  state.drawChances -= 1;
  state.totalDraws += 1;
  state.pendingSingle = generateCard();
  saveState();
  render();
}

function attemptHire(card) {
  // 返回 {ok, dup, rate}
  const rate = card.isN ? 0 : hireRate(card.level, card.districtHire);
  const roll = Math.random() * 100;
  const ok = roll < rate;
  let dup = false;
  if (ok) {
    const col = state.collection[card.level];
    if (col.includes(card.name)) {
      dup = true;
    } else {
      col.push(card.name);
    }
    // 替换当前工作
    state.currentJob = {
      name: card.name,
      level: card.level,
      district: card.district,
      salaryMin: card.salaryMin,
      salaryMax: card.salaryMax
    };
    state.stats.successCount++;
    // bestJob
    const order = { R:1, SR:2, SSR:3 };
    const cur = state.stats.bestJob;
    if (!cur || order[card.level] > order[cur.level]) {
      state.stats.bestJob = { name: card.name, level: card.level };
    }
  } else {
    state.stats.missCount++;
  }
  return { ok: ok, dup: dup, rate: rate };
}

function acceptSingle() {
  if (!state.pendingSingle) return;
  const card = state.pendingSingle;
  if (card.isN) {
    toast('错过：N 卡不可录取');
    addLog(`抽到 N 卡：错过`, 'sys');
    state.pendingSingle = null;
    saveState();
    render();
    return;
  }
  const res = attemptHire(card);
  if (res.ok) {
    toast(res.dup ? `「${card.name}」已在图鉴中，已重新入职` : '录取成功！');
    addLog(`录取成功：${card.name}（${card.level}）@ ${card.district}，录取率 ${pct(res.rate)}`, 'pos');
  } else {
    toast('错失良机');
    addLog(`录取失败：${card.name}（${card.level}），录取率 ${pct(res.rate)} - 错失良机`, 'neg');
  }
  state.pendingSingle = null;
  saveState();
  render();
}

function declineSingle() {
  if (!state.pendingSingle) return;
  const card = state.pendingSingle;
  addLog(`放弃：${card.isN ? 'N 卡错过' : card.name + '（' + card.level + '）'}`, 'sys');
  state.pendingSingle = null;
  saveState();
  render();
}

function tenDraw() {
  if (state.gameOver) { toast('游戏已结束，请重新开始'); return; }
  if (state.drawChances < 10) { toast('需要 10 次抽卡机会'); return; }
  state.drawChances -= 10;
  state.totalDraws += 10;
  const cards = [];
  for (let i = 0; i < 10; i++) cards.push(generateCard());
  state.pendingTen = { cards: cards, resolved: false, selectedIndex: -1, results: null };
  saveState();
  render();
  openTenModal();
}

function tenSelect(index) {
  if (!state.pendingTen || state.pendingTen.resolved) return;
  state.pendingTen.selectedIndex = index;
  renderTenModal();
}

function tenConfirm() {
  if (!state.pendingTen || state.pendingTen.resolved) return;
  const idx = state.pendingTen.selectedIndex;
  if (idx < 0) { toast('请先选择一张卡牌'); return; }
  const cards = state.pendingTen.cards;
  const results = cards.map(() => null);
  const card = cards[idx];
  let msg = '';
  if (card.isN) {
    results[idx] = { ok: false, n: true };
    msg = '选中 N 卡：错过';
    addLog('十连抽：选中 N 卡 - 错过', 'sys');
  } else {
    const res = attemptHire(card);
    results[idx] = { ok: res.ok, dup: res.dup };
    if (res.ok) {
      msg = res.dup ? `「${card.name}」已在图鉴，已重新入职` : '录取成功！';
      addLog(`十连录取成功：${card.name}（${card.level}）@ ${card.district}`, 'pos');
    } else {
      msg = '错失良机';
      addLog(`十连录取失败：${card.name}（${card.level}）- 错失良机`, 'neg');
    }
  }
  state.pendingTen.resolved = true;
  state.pendingTen.results = results;
  toast(msg);
  saveState();
  renderTenModal();
}

function tenDeclineAll() {
  if (!state.pendingTen) return;
  if (!state.pendingTen.resolved) {
    addLog('十连抽：全部放弃', 'sys');
  }
  state.pendingTen = null;
  saveState();
  closeTenModal();
  render();
}

/* ============== 每月结算 ============== */

function settleMonth() {
  if (state.gameOver) { toast('游戏已结束，请重新开始'); return; }
  // 如有待处理的抽卡，提示
  if (state.pendingSingle || (state.pendingTen && !state.pendingTen.resolved)) {
    toast('请先处理当前抽卡结果');
    return;
  }

  let income = 0;
  let district;
  let rent = 0, living = 0;

  if (state.currentJob) {
    district = findDistrict(state.currentJob.district);
    const raw = randFloat(state.currentJob.salaryMin, state.currentJob.salaryMax);
    income = raw * (1 - state.nextIncomePenalty);
    rent = randFloat(district.rentMin, district.rentMax);
    living = district.living;
    state.stats.monthsWorked++;
  } else {
    district = pickDistrict();
    rent = randFloat(district.rentMin, district.rentMax);
    living = district.living;
  }

  // 应用本月过劳惩罚后重置（下月重新累计）
  const appliedPenalty = state.nextIncomePenalty;
  state.nextIncomePenalty = 0;

  const expense = rent + living;
  let eventMoney = 0;
  let eventObj = null;
  let lostJobViaEvent = false;

  // 事件判定
  if (Math.random() < 0.3) {
    state.stats.eventTriggered++;
    if (Math.random() < 0.4) {
      // 正面
      eventObj = pickWeighted(EVENTS_POS, [25,25,25,25]);
      if (eventObj.type === 'money') {
        eventMoney = randInt(eventObj.min, eventObj.max);
      } else if (eventObj.type === 'draws') {
        state.drawChances += eventObj.value;
      }
    } else {
      // 负面
      eventObj = pickWeighted(EVENTS_NEG, [20,20,20,15,15,10]);
      if (eventObj.type === 'income_half') income *= 0.5;
      else if (eventObj.type === 'income_zero') income = 0;
      else if (eventObj.type === 'money') eventMoney = eventObj.min;
      else if (eventObj.type === 'lose_job') lostJobViaEvent = true;
      else if (eventObj.type === 'penalty') state.nextIncomePenalty += 0.1;
    }
  }

  const netIncome = income - expense + eventMoney;
  state.netWorth += netIncome;
  state.totalIncome += income;

  // 日志
  let logType = 'sys';
  let logText = `第 ${state.currentMonth} 月结算：收入 ${fmt(income)} - 支出 ${fmt(expense)}`;
  if (appliedPenalty > 0) logText += `（过劳 -${Math.round(appliedPenalty*100)}%）`;
  logText += ` = 净 ${netIncome >= 0 ? '+' : ''}${fmt(netIncome)}`;
  addLog(logText, logType);

  if (eventObj) {
    const isPos = EVENTS_POS.indexOf(eventObj) >= 0;
    addLog(`${isPos ? '【正面】' : '【负面】'}${eventObj.name}：${eventObj.desc}`, isPos ? 'pos' : 'neg');
  }

  // 无故辞退
  if (lostJobViaEvent && state.currentJob) {
    addLog(`被无故辞退：失去工作「${state.currentJob.name}」`, 'neg');
    state.currentJob = null;
  }

  // 离职判定（仅在仍有工作时）
  if (state.currentJob) {
    const quitRate = district.quit / 100;
    if (Math.random() < quitRate) {
      addLog(`离职：失去工作「${state.currentJob.name}」（${district.name}离职率 ${district.quit}%）`, 'neg');
      state.currentJob = null;
    }
  }

  // 月份推进 + 每月抽卡
  state.currentMonth++;
  state.drawChances += 1;

  // 胜负判定
  if (state.netWorth < BANKRUPT) {
    state.gameOver = true;
    state.gameResult = 'bankrupt';
    addLog('净资产跌破破产线，游戏结束', 'neg');
  } else if (state.currentMonth > TOTAL_MONTHS) {
    state.gameOver = true;
    state.gameResult = state.netWorth >= GOAL ? 'win' : 'fail';
    addLog(state.gameResult === 'win' ? '十年期满，达成百万目标，胜利！' : '十年期满，未能达成百万目标', state.gameResult === 'win' ? 'pos' : 'neg');
  } else if (state.netWorth >= GOAL) {
    // 提前达成
    state.gameOver = true;
    state.gameResult = 'win';
    addLog('净资产突破 100 万，提前达成目标，胜利！', 'pos');
  }

  saveState();
  render();
  if (state.gameOver) openEndModal();
}

/* ============== 重置 ============== */

function resetGame() {
  if (!confirm('确定重新开始？当前进度将被清空。')) return;
  state = defaultState();
  saveState();
  render();
  toast('已重新开始，祝你好运');
}

/* ============== 渲染 ============== */

function $(id) { return document.getElementById(id); }

function render() {
  // 状态栏
  $('stMonth').textContent = `${state.currentMonth} / ${TOTAL_MONTHS}`;
  const netEl = $('stNet');
  netEl.textContent = fmt(state.netWorth);
  netEl.classList.toggle('warn', state.netWorth < 0);
  netEl.classList.toggle('good', state.netWorth >= GOAL);
  const prog = clamp(state.netWorth / GOAL * 100, 0, 100);
  $('stBar').style.width = Math.max(prog, 0.5) + '%';
  $('stDraw').textContent = state.drawChances;

  // 当前工作
  renderJob();

  // 按钮可用性
  const ended = state.gameOver;
  const pending = state.pendingSingle || (state.pendingTen && !state.pendingTen.resolved);
  $('btnSingle').disabled = ended || state.drawChances < 1;
  $('btnTen').disabled = ended || state.drawChances < 10;
  $('btnNext').disabled = ended || !!pending;

  // 抽卡结果
  renderDrawResult();

  // 图鉴计数
  const collected = state.collection.R.length + state.collection.SR.length + state.collection.SSR.length;
  const total = JOBS.R.length + JOBS.SR.length + JOBS.SSR.length;
  $('dexCount').textContent = `${collected} / ${total}`;

  // 日志
  renderLog();
}

function renderJob() {
  const body = $('jobBody');
  const tag = $('jobTag');
  if (!state.currentJob) {
    tag.textContent = '无业';
    body.innerHTML = '<div class="empty-hint">尚未入职，请抽卡获取工作机会</div>';
    return;
  }
  const j = state.currentJob;
  const d = findDistrict(j.district);
  tag.textContent = LEVEL_NAME[j.level];
  body.innerHTML = `
    <div class="job-head">
      <span class="lvl lvl-${j.level}">${j.level}</span>
      <span class="job-name">${j.name}</span>
      <span class="job-meta">${j.district}</span>
    </div>
    <div class="job-rows">
      <div><span class="k">月薪范围：</span><span class="v">${fmt(j.salaryMin)} ~ ${fmt(j.salaryMax)} 元</span></div>
      <div><span class="k">所在区月租：</span><span class="v">${fmt(d.rentMin)} ~ ${fmt(d.rentMax)} 元</span></div>
      <div><span class="k">生活费：</span><span class="v">${fmt(d.living)} 元/月</span></div>
      <div><span class="k">月离职率：</span><span class="v">${d.quit}%</span></div>
      <div><span class="k">地区录取率：</span><span class="v">${d.hire}%</span></div>
      <div><span class="k">预估月支出：</span><span class="v">${fmt(d.rentMin + d.living)} ~ ${fmt(d.rentMax + d.living)} 元</span></div>
    </div>
  `;
}

function renderDrawResult() {
  const card = $('drawResultCard');
  const body = $('drawResultBody');
  if (state.pendingSingle) {
    card.style.display = '';
    body.innerHTML = renderBigCard(state.pendingSingle) + `
      <div class="draw-actions" style="margin-top:14px">
        ${state.pendingSingle.isN
          ? `<button class="btn" id="drDismiss"><span>关闭</span></button>`
          : `<button class="btn primary" id="drAccept"><span>录取</span></button>
             <button class="btn" id="drDecline"><span>放弃</span></button>`}
      </div>
    `;
    if (state.pendingSingle.isN) {
      $('drDismiss').onclick = () => { state.pendingSingle = null; saveState(); render(); };
    } else {
      $('drAccept').onclick = acceptSingle;
      $('drDecline').onclick = declineSingle;
    }
  } else {
    card.style.display = 'none';
    body.innerHTML = '';
  }
}

function renderBigCard(card) {
  if (card.isN) {
    return `
      <div class="big-card n-card">
        <div class="lvl-strip" style="background:var(--level-N)"></div>
        <div class="row-top">
          <span class="lvl lvl-N">N</span>
          <span class="hire-rate">错过 · 无工作机会</span>
        </div>
        <div class="job-name-big">错过</div>
        <div class="job-district">此次未获得工作机会</div>
        <div class="salary" style="color:var(--text-faint)">无收入<span class="unit"></span></div>
      </div>
    `;
  }
  const rate = hireRate(card.level, card.districtHire);
  return `
    <div class="big-card">
      <div class="lvl-strip" style="background:var(--level-${card.level})"></div>
      <div class="row-top">
        <span class="lvl lvl-${card.level}">${card.level} · ${LEVEL_NAME[card.level]}</span>
        <span class="hire-rate">录取率 ${pct(rate)}</span>
      </div>
      <div class="job-name-big">${card.name}</div>
      <div class="job-district">${card.district} · 月租 ${fmt(card.rentMin)}~${fmt(card.rentMax)} · 生活费 ${fmt(card.living)}</div>
      <div class="salary">${fmt(card.salaryMin)} ~ ${fmt(card.salaryMax)} <span class="unit">元/月</span></div>
    </div>
  `;
}

function renderLog() {
  const list = $('logList');
  if (!state.log.length) {
    list.innerHTML = '<div class="log-empty">暂无事件，开始你的杭州求职之旅吧</div>';
    return;
  }
  list.innerHTML = state.log.slice(0, 10).map(l => `
    <div class="log-item ${l.type}">
      <span class="m">第${l.month}月</span>${escapeHtml(l.text)}
    </div>
  `).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============== 弹窗 ============== */

function openTenModal() { $('tenModal').classList.add('show'); renderTenModal(); }
function closeTenModal() { $('tenModal').classList.remove('show'); }

function renderTenModal() {
  const pt = state.pendingTen;
  const body = $('tenBody');
  const hint = $('tenHint');
  if (!pt) { closeTenModal(); return; }
  const resolved = pt.resolved;
  body.innerHTML = `<div class="ten-grid">${pt.cards.map((c, i) => {
    const sel = pt.selectedIndex === i;
    let resultHtml = '';
    if (resolved && pt.results && pt.results[i] !== null) {
      const r = pt.results[i];
      if (r.n) resultHtml = `<div class="mc-result no">错过</div>`;
      else if (r.ok) resultHtml = `<div class="mc-result ok">录取${r.dup ? '(已有)' : ''}</div>`;
      else resultHtml = `<div class="mc-result no">错失</div>`;
    }
    return `<div class="mini-card ${sel ? 'selected' : ''} ${resolved ? 'locked' : ''}" data-i="${i}">
      <span class="lvl lvl-${c.level} mc-lvl">${c.level}</span>
      <span class="mc-name">${c.isN ? '错过' : c.name}</span>
      ${c.isN ? '' : `<span class="mc-dist">${c.district}</span>`}
      ${resultHtml}
    </div>`;
  }).join('')}</div>`;

  // 绑定点击
  body.querySelectorAll('.mini-card').forEach(el => {
    if (resolved) return;
    el.onclick = () => tenSelect(parseInt(el.dataset.i, 10));
  });

  $('tenConfirm').disabled = resolved || pt.selectedIndex < 0;
  $('tenConfirm').style.display = resolved ? 'none' : '';
  $('tenDecline').querySelector('span').textContent = resolved ? '关闭' : '全部放弃';
  if (resolved) {
    hint.textContent = '本轮十连抽已结算，点击下方按钮关闭';
  } else {
    hint.textContent = pt.selectedIndex >= 0 ? '已选中，点击「录取选中卡牌」确认' : '点击任意卡牌选中后录取';
  }
}

function openDexModal() { renderDexModal(); $('dexModal').classList.add('show'); }

function renderDexModal() {
  const body = $('dexBody');
  const groups = [
    { level:'R', label:'R · 基层工作' },
    { level:'SR', label:'SR · 中级工作' },
    { level:'SSR', label:'SSR · 高级工作' }
  ];
  let collected = 0, total = 0;
  body.innerHTML = groups.map(g => {
    const all = JOBS[g.level];
    const got = state.collection[g.level];
    collected += got.length;
    total += all.length;
    const cells = all.map(name => {
      const has = got.includes(name);
      return `<div class="dex-cell ${has ? 'got' : 'lock'}">
        <div class="dn">${has ? escapeHtml(name) : '？？？'}</div>
        <div class="dd">${has ? '已获得' : '未获得'}</div>
      </div>`;
    }).join('');
    return `<div class="dex-group">
      <h4><span class="lvl lvl-${g.level}">${g.level}</span> ${g.label} <span class="prog">${got.length} / ${all.length}</span></h4>
      <div class="dex-grid">${cells}</div>
    </div>`;
  }).join('');
  body.insertAdjacentHTML('beforeend', `<div class="overlay-hint">总进度：${collected} / ${total}</div>`);
}

function openSetModal() {
  $('hzSwitch').classList.toggle('on', state.settings.hzBoost);
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  $('themeSwitch').classList.toggle('on', dark);
  $('setModal').classList.add('show');
}

function openEndModal() {
  const r = state.gameResult;
  const map = {
    win: { cls:'win', title:'胜利！扎根杭州' },
    fail: { cls:'fail', title:'十年期满 · 未达目标' },
    bankrupt: { cls:'bankrupt', title:'破产出局' }
  };
  const info = map[r] || map.fail;
  const best = state.stats.bestJob ? `${state.stats.bestJob.name}（${state.stats.bestJob.level}）` : '无';
  $('endBody').innerHTML = `
    <div class="end-screen ${info.cls}">
      <div class="end-title">${info.title}</div>
      <div style="color:var(--text-soft);font-size:14px">${r === 'win' ? '你用十年时间在杭州攒下百万资产，恭喜！' : r === 'bankrupt' ? '净资产跌破 -50,000，你被迫离开杭州。' : '120 个月过去，你距离百万目标还有一段距离。'}</div>
      <div class="end-stats">
        <div class="es"><div class="k">最终净资产</div><div class="v">${fmt(state.netWorth)} 元</div></div>
        <div class="es"><div class="k">累计总收入</div><div class="v">${fmt(state.totalIncome)} 元</div></div>
        <div class="es"><div class="k">经历月份</div><div class="v">${Math.min(state.currentMonth - 1, TOTAL_MONTHS)} / ${TOTAL_MONTHS}</div></div>
        <div class="es"><div class="k">累计抽卡</div><div class="v">${state.totalDraws} 次</div></div>
        <div class="es"><div class="k">录取成功</div><div class="v">${state.stats.successCount} 次</div></div>
        <div class="es"><div class="k">录取失败</div><div class="v">${state.stats.missCount} 次</div></div>
        <div class="es"><div class="k">触发事件</div><div class="v">${state.stats.eventTriggered} 次</div></div>
        <div class="es"><div class="k">最高职位</div><div class="v">${escapeHtml(best)}</div></div>
      </div>
      <div class="draw-actions">
        <button class="btn primary" id="endRestart"><span>重新开始</span></button>
        <button class="btn" id="endClose"><span>查看记录</span></button>
      </div>
    </div>
  `;
  $('endModal').classList.add('show');
  $('endRestart').onclick = () => { $('endModal').classList.remove('show'); resetGame(); };
  $('endClose').onclick = () => { $('endModal').classList.remove('show'); };
}

/* ============== toast ============== */

let toastTimer = null;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ============== 主题 ============== */

function applyTheme(dark) {
  if (dark) {
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem(THEME_KEY, 'dark');
  } else {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem(THEME_KEY, 'light');
  }
  const tt = $('themeToggle');
  tt.textContent = dark ? '日间模式' : '夜间模式';
}

function toggleTheme() {
  const dark = document.documentElement.getAttribute('data-theme') !== 'dark';
  applyTheme(dark);
  // 同步设置弹窗开关
  if ($('setModal').classList.contains('show')) {
    $('themeSwitch').classList.toggle('on', dark);
  }
}

/* ============== 事件绑定 ============== */

function bindEvents() {
  $('btnSingle').onclick = singleDraw;
  $('btnTen').onclick = tenDraw;
  $('btnNext').onclick = settleMonth;
  $('btnDex').onclick = openDexModal;
  $('btnReset').onclick = resetGame;
  $('themeToggle').onclick = toggleTheme;

  $('tenClose').onclick = tenDeclineAll;
  $('tenConfirm').onclick = tenConfirm;
  $('tenDecline').onclick = tenDeclineAll;
  $('tenModal').onclick = (e) => { if (e.target === $('tenModal') && !state.pendingTen?.resolved) { /* 不允许点遮罩关闭未结算 */ } };

  $('dexClose').onclick = () => $('dexModal').classList.remove('show');
  $('setClose').onclick = () => $('setModal').classList.remove('show');

  $('hzSwitch').onclick = () => {
    state.settings.hzBoost = !state.settings.hzBoost;
    $('hzSwitch').classList.toggle('on', state.settings.hzBoost);
    saveState();
    toast(state.settings.hzBoost ? '杭州地区加成已开启' : '杭州地区加成已关闭');
  };
  $('themeSwitch').onclick = toggleTheme;

  // 弹窗遮罩点击关闭（图鉴/设置）
  $('dexModal').addEventListener('click', (e) => { if (e.target === $('dexModal')) $('dexModal').classList.remove('show'); });
  $('setModal').addEventListener('click', (e) => { if (e.target === $('setModal')) $('setModal').classList.remove('show'); });

  // 键盘快捷键
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.key === 'Escape') {
      ['tenModal','dexModal','setModal','endModal'].forEach(id => $(id).classList.remove('show'));
    }
  });
}

// 设置按钮入口（顶部没有独立按钮，把主题按钮长按/双击触发设置；这里把主题切换即设置入口）
// 简化：把"夜间模式"按钮作为主题切换，设置弹窗通过主题开关内的入口访问
// 这里追加一个隐藏入口：点击标题副标题打开设置
function bindSettingsEntry() {
  const sub = document.querySelector('.topbar .sub');
  if (sub) {
    sub.style.cursor = 'pointer';
    sub.title = '点击打开设置';
    sub.onclick = openSetModal;
  }
}

/* ============== 初始化 ============== */

function initTheme() {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  $('themeToggle').textContent = dark ? '日间模式' : '夜间模式';
}

function init() {
  loadState();
  initTheme();
  bindEvents();
  bindSettingsEntry();
  render();
  // 若存在未结算的十连抽，恢复弹窗
  if (state.pendingTen && !state.pendingTen.resolved) {
    openTenModal();
  }
  // 若游戏已结束，提示
  if (state.gameOver) {
    setTimeout(openEndModal, 200);
  }
}

init();
</script>
</body>
</html>
