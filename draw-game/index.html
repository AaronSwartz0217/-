<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>求职卡牌策略 · 杭州十年百万</title>
<script>
  // 尽早应用主题（与主站一致），避免加载闪烁
  (function () {
    var saved = localStorage.getItem('theme');
    var dark = saved ? saved === 'dark'
      : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="title">求职卡牌策略 · 杭州十年百万</div>
      <div class="sub">在杭州工作 10 年（120 个月），累计净资产达到 100 万元</div>
    </div>
    <button class="icon-btn" id="themeToggle">夜间模式</button>
  </div>

  <!-- 状态栏 -->
  <div class="statusbar">
    <div class="stat">
      <div class="label">月份</div>
      <div class="value" id="stMonth">1 / 120</div>
    </div>
    <div class="stat">
      <div class="label">净资产（元）</div>
      <div class="value" id="stNet">15,000</div>
      <div class="progress"><i id="stBar" style="width:1.5%"></i></div>
    </div>
    <div class="stat">
      <div class="label">抽卡次数</div>
      <div class="value" id="stDraw">0</div>
    </div>
  </div>

  <!-- 当前工作 -->
  <div class="card job-card">
    <div class="section-title">当前工作 <span class="tag" id="jobTag">无业</span><button class="icon-btn theme-inline" id="themeInline" type="button">主题</button></div>
    <div id="jobBody"><div class="empty-hint">尚未入职，请抽卡获取工作机会</div></div>
  </div>

  <!-- 操作按钮 -->
  <div class="actions">
    <button class="btn primary" id="btnSingle"><span>单抽</span><span class="btn-sub">消耗 1 次</span></button>
    <button class="btn" id="btnTen"><span>十连抽</span><span class="btn-sub">消耗 10 次</span></button>
    <button class="btn" id="btnNext"><span>跳过本月</span><span class="btn-sub">不抽卡直接过月</span></button>
    <button class="btn" id="btnDex"><span>图鉴</span><span class="btn-sub" id="dexCount">0 / 29</span></button>
    <button class="btn danger" id="btnReset"><span>重新开始</span><span class="btn-sub">清空存档</span></button>
  </div>

  <!-- 事件日志 -->
  <div class="card">
    <div class="section-title">事件日志 <span class="tag" id="logTag">最近 10 条</span></div>
    <div class="log-list" id="logList"></div>
  </div>

  <!-- 兑换码 -->
  <div class="card redeem-card">
    <div class="section-title">兑换码</div>
    <div class="redeem-row">
      <input type="text" id="redeemInput" class="redeem-input" placeholder="输入兑换码" autocomplete="off">
      <button class="btn primary" id="btnRedeem"><span>兑换</span></button>
    </div>
  </div>

  <div class="foot">
    目标 1,000,000 元 · 破产线 -50,000 元 · 数据自动保存到本地浏览器<br>
    <a href="../index.html">返回主站</a>
  </div>
</div>

<!-- 单抽弹窗 -->
<div class="modal-mask" id="singleModal">
  <div class="modal" style="max-width:420px">
    <div class="modal-head">
      <h3>抽卡结果</h3>
    </div>
    <div id="singleBody"></div>
    <div class="draw-actions" id="singleActions" style="margin-top:14px"></div>
  </div>
</div>

<!-- 十连抽弹窗 -->
<div class="modal-mask" id="tenModal">
  <div class="modal">
    <div class="modal-head">
      <h3>十连抽结果（10 选 1）</h3>
      <button class="modal-close" id="tenClose">×</button>
    </div>
    <div id="tenBody"></div>
    <div class="draw-actions" id="tenActions">
      <button class="btn primary" id="tenConfirm" disabled><span>录取选中卡牌</span></button>
      <button class="btn" id="tenDecline"><span>全部放弃</span></button>
    </div>
    <div class="overlay-hint" id="tenHint">点击任意卡牌选中后录取</div>
  </div>
</div>

<!-- 图鉴弹窗 -->
<div class="modal-mask" id="dexModal">
  <div class="modal">
    <div class="modal-head">
      <h3>工作图鉴</h3>
      <button class="modal-close" id="dexClose">×</button>
    </div>
    <div id="dexBody"></div>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="modal-mask" id="setModal">
  <div class="modal">
    <div class="modal-head">
      <h3>游戏设置</h3>
      <button class="modal-close" id="setClose">×</button>
    </div>
    <div class="switch-row">
      <div>
        <div class="lbl">杭州地区加成</div>
        <div class="desc">SR/SSR 出现率 +5%，R/SR/SSR 录取率提升</div>
      </div>
      <div class="switch on" id="hzSwitch"></div>
    </div>
    <div class="switch-row">
      <div>
        <div class="lbl">夜间模式</div>
        <div class="desc">切换明暗主题</div>
      </div>
      <div class="switch" id="themeSwitch"></div>
    </div>
  </div>
</div>

<!-- 确认弹窗（用于主动离职等确认操作） -->
<div class="modal-mask" id="confirmModal">
  <div class="modal" style="max-width:380px">
    <div class="modal-head">
      <h3 id="confirmTitle">确认</h3>
      <button class="modal-close" id="confirmClose">×</button>
    </div>
    <div class="confirm-body" id="confirmBody"></div>
    <div class="draw-actions" style="margin-top:16px">
      <button class="btn" id="confirmCancel"><span>取消</span></button>
      <button class="btn danger" id="confirmOk"><span>确认</span></button>
    </div>
  </div>
</div>

<!-- 游戏结束弹窗 -->
<div class="modal-mask" id="endModal">
  <div class="modal">
    <div id="endBody"></div>
  </div>
</div>

<!-- 抉择事件弹窗 -->
<div class="modal-mask" id="choiceModal">
  <div class="modal choice-modal" style="max-width:440px">
    <div class="modal-head">
      <h3 id="choiceTitle">抉择</h3>
    </div>
    <div class="choice-desc" id="choiceDesc"></div>
    <div class="choice-options" id="choiceOptions"></div>
  </div>
</div>

<!-- 随机事件弹窗 -->
<div class="modal-mask" id="eventModal">
  <div class="modal" style="max-width:400px">
    <div class="modal-head">
      <h3 id="eventTitle">事件</h3>
    </div>
    <div id="eventBody"></div>
    <div class="draw-actions" style="margin-top:14px">
      <button class="btn primary" id="eventOk"><span>知道了</span></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="game-data.js"></script>
<script src="game-engine.js"></script>
<script src="game-ui.js"></script>
<script src="main.js"></script>
</body>
</html>
