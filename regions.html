<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>按地区筛选 · 杭州求职避雷网</title>
<link rel="stylesheet" href="style.css">
<script>
  (function () {
    var saved = localStorage.getItem('theme');
    var dark = saved ? saved === 'dark'
      : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <div class="mode-switch" id="modeSwitch" data-mode="lei" role="tablist" aria-label="模式切换">
        <span class="mode-thumb"></span>
        <button class="mode-opt active" data-target="index.html" role="tab">避雷</button>
        <button class="mode-opt" data-target="novel.html" role="tab">小说</button>
      </div>
      <a class="icon-btn" href="index.html" title="返回搜索">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>
        </svg>
        返回搜索
      </a>
    </div>
    <button class="icon-btn" id="themeToggle">夜间模式</button>
  </div>

  <div class="wrap wide">
    <div class="header">
      <h1>按地区筛选</h1>
      <p>选择行政区，或按风险标签查看对应的避雷企业。点击卡片查看完整避雷详情。</p>
    </div>

    <!-- 地区筛选：点击地图行政区进行筛选（单选），下方补充「外地 / 杭州全域」入口 -->
    <div class="filter-section">
      <div class="filter-label">按地区 · 点击地图选择</div>
      <div class="map-wrap">
        <img class="map-image" src="杭州行政区地图底图.png" width="730" height="547" alt="杭州市行政区划地图">
        <svg class="hit-map" id="hitMap" viewBox="0 0 730 547" role="group" aria-label="杭州行政区选择层"></svg>
      </div>
      <div class="map-selected" id="mapSelected"></div>
      <div class="chips" id="extraDistrictChips"></div>
    </div>

    <div class="filter-section">
      <div class="filter-label">按风险标签</div>
      <div class="chips" id="tagChips"></div>
    </div>

    <div class="result-head">
      <h2 id="resultTitle">全部企业</h2>
      <span class="count" id="resultCount"></span>
    </div>
    <div id="results"></div>

    <div class="footer">
      <div id="disclaimer" class="disclaimer"></div>
      <button class="contact-link" id="contactBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        联系我们
      </button>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal" id="modal"></div>
  </div>

  <div class="agreement-overlay" id="agreementOverlay"></div>

<script src="data.js"></script>
<script src="mapdata.js"></script>
<script src="common.js"></script>
<script src="regions.js"></script>
</body>
</html>
