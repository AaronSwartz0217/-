// 杭州各区在示意地图上的相对布局（col/row 网格坐标，仅表示大致方位）
const HZ_DISTRICTS = [
  { key: "余杭区", col: 0, row: 0 },
  { key: "临平区", col: 2, row: 0 },
  { key: "拱墅区", col: 1, row: 1 },
  { key: "西湖区", col: 0, row: 1 },
  { key: "上城区", col: 2, row: 1 },
  { key: "钱塘区", col: 3, row: 1 },
  { key: "滨江区", col: 1, row: 2 },
  { key: "萧山区", col: 2, row: 2 }
];

const input = document.getElementById('searchInput');
const btn = document.getElementById('searchBtn');
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');
const suggest = document.getElementById('suggest');
const stat = document.getElementById('stat');
const regionBtn = document.getElementById('regionBtn');

stat.textContent = `已收录 ${BLACKLIST.length} 家`;

// 归一化：去除常见后缀与空白，便于模糊匹配
function normalize(s) {
  return s.replace(/\s+/g, '')
          .replace(/（[^）]*）/g, '')
          .replace(/(有限公司|有限责任公司|股份公司|公司|集团)$/g, '')
          .toLowerCase();
}

function matchNames(c) {
  const names = [c.name, c.fullName].concat(c.alias || []);
  return names.map(normalize);
}

function search(query) {
  const q = normalize(query);
  if (!q) return [];
  return BLACKLIST.filter(c =>
    matchNames(c).some(n => n && (n.includes(q) || q.includes(n)))
  );
}

function countByDistrict(district) {
  return BLACKLIST.filter(c => c.district === district).length;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[m]));
}

function showDanger(company) {
  const groupHtml = company.group
    ? `<div class="group-note"><span class="label">关联提醒</span>${esc(company.group)}</div>` : '';
  const tagsHtml = company.tags
    ? `<div class="tags">${company.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : '';
  modal.className = 'modal danger';
  modal.innerHTML = `
    <span class="badge">命中黑名单 · 建议避雷</span>
    <h2>${esc(company.name)}</h2>
    <div class="subtitle">${esc(company.fullName)} · ${esc(company.district)}</div>
    ${tagsHtml}
    <div class="reason"><span class="label">避雷原因</span>${esc(company.reason)}</div>
    ${groupHtml}
    <button class="close-btn" id="closeBtn">我知道了</button>
  `;
  openModal();
}

function showSafe(query) {
  modal.className = 'modal safe';
  modal.innerHTML = `
    <span class="badge">未命中黑名单</span>
    <h2>暂未收录「${esc(query)}」</h2>
    <div class="desc">
      未在当前黑名单中查询到该公司。但这<b>不代表该公司一定安全</b>——本站数据有限，仅收录部分被举报企业。<br><br>
      建议结合天眼查、脉脉、社交平台等多方信息综合判断，谨慎求职。
    </div>
    <button class="close-btn" id="closeBtn">好的</button>
  `;
  openModal();
}

// 地区选择：地图 + 外地
function showRegionPicker() {
  const cell = 118, gap = 12, cols = 4, rows = 3;
  const w = cols * cell + (cols - 1) * gap;
  const h = rows * cell + (rows - 1) * gap;
  const cellsSvg = HZ_DISTRICTS.map(d => {
    const x = d.col * (cell + gap);
    const y = d.row * (cell + gap);
    const cnt = countByDistrict(d.key);
    const cls = cnt > 0 ? 'region-cell has-risk' : 'region-cell';
    const cntText = cnt > 0
      ? `<text class="rc" x="${x + cell/2}" y="${y + cell/2 + 16}">${cnt} 家</text>` : '';
    return `<g class="${cls}" data-district="${esc(d.key)}" role="button" tabindex="0" aria-label="${esc(d.key)} ${cnt} 家">
      <rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="10"></rect>
      <text class="rn" x="${x + cell/2}" y="${y + cell/2 - 2}">${esc(d.key)}</text>
      ${cntText}
    </g>`;
  }).join('');

  const otherKeys = [...new Set(BLACKLIST.map(c => c.district))]
    .filter(d => !HZ_DISTRICTS.some(hz => hz.key === d));
  const otherChips = otherKeys.map(k =>
    `<button class="region-chip" data-district="${esc(k)}">${esc(k)}<span class="cnt">${countByDistrict(k)}</span></button>`
  ).join('');

  modal.className = 'modal region wide';
  modal.innerHTML = `
    <span class="badge">按地区筛选</span>
    <h2>选择地区</h2>
    <div class="subtitle">点击地图区块查看该区避雷企业。标红区块表示已有收录。</div>
    <div class="map-wrap">
      <svg class="hz-map" viewBox="0 0 ${w} ${h}">${cellsSvg}</svg>
    </div>
    <div class="section-label">杭州以外 / 其他</div>
    <div class="other-regions">${otherChips || '<span class="empty">暂无</span>'}</div>
    <button class="close-btn" id="closeBtn" style="margin-top:18px;">关闭</button>
  `;
  openModal();

  modal.querySelectorAll('[data-district]').forEach(el => {
    const go = () => showRegionCompanies(el.getAttribute('data-district'));
    el.addEventListener('click', go);
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
    });
  });
}

function showRegionCompanies(district) {
  const list = BLACKLIST.filter(c => c.district === district);
  const cards = list.length
    ? list.map(c => `
      <div class="company-card">
        <div class="cc-name">${esc(c.name)}</div>
        <div class="cc-full">${esc(c.fullName)}</div>
        <div class="cc-reason">${esc(c.reason)}</div>
      </div>`).join('')
    : '<div class="empty">该地区暂无收录企业。</div>';

  modal.className = 'modal region wide';
  modal.innerHTML = `
    <span class="badge">${esc(district)}</span>
    <h2>${esc(district)} · 避雷企业</h2>
    <div class="subtitle">共 ${list.length} 家</div>
    ${cards}
    <button class="close-btn" id="backBtn" style="margin-bottom:10px;">返回地区选择</button>
    <button class="close-btn" id="closeBtn">关闭</button>
  `;
  openModal();
  const back = document.getElementById('backBtn');
  if (back) back.onclick = showRegionPicker;
}

function openModal() {
  overlay.classList.add('show');
  const c = document.getElementById('closeBtn');
  if (c) c.onclick = closeModal;
}
function closeModal() { overlay.classList.remove('show'); }
overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };

function doSearch() {
  const query = input.value.trim();
  if (!query) { input.focus(); return; }
  const results = search(query);
  suggest.innerHTML = '';

  if (results.length === 0) {
    showSafe(query);
  } else if (results.length === 1) {
    showDanger(results[0]);
  } else {
    results.forEach(c => {
      const div = document.createElement('div');
      div.className = 'suggest-item';
      div.textContent = `${c.name}（${c.district}）`;
      div.onclick = () => { suggest.innerHTML = ''; showDanger(c); };
      suggest.appendChild(div);
    });
  }
}

btn.onclick = doSearch;
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
regionBtn.onclick = showRegionPicker;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

// 夜间模式切换
const themeToggle = document.getElementById('themeToggle');
function syncThemeLabel() {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  themeToggle.textContent = dark ? '日间模式' : '夜间模式';
}
syncThemeLabel();
themeToggle.onclick = () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (dark) {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('theme', 'light');
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('theme', 'dark');
  }
  syncThemeLabel();
};
</script>
