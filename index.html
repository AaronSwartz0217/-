<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>杭州求职避雷网</title>
<link rel="stylesheet" href="style.css">
<script>
  // 尽早应用主题，避免加载闪烁
  (function () {
    var saved = localStorage.getItem('theme');
    var dark = saved ? saved === 'dark'
      : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>
</head>
<body class="center">
  <div class="topbar">
    <a class="icon-btn" href="regions.html" title="按地区筛选">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      地区筛选
    </a>
    <button class="icon-btn" id="themeToggle">夜间模式</button>
  </div>

  <div class="wrap">
    <div class="header">
      <h1>杭州求职避雷网</h1>
      <p>输入公司名称查询，或点击左上角按地区查看避雷企业。</p>
    </div>

    <div class="search-box">
      <input id="searchInput" type="text" placeholder="输入公司名称，如「索泊」「百秋电商」" autocomplete="off">
      <button id="searchBtn">查询</button>
    </div>

    <div class="meta">
      <span>支持模糊匹配，输入部分关键字即可</span>
      <span id="stat"></span>
    </div>

    <div class="suggest" id="suggest"></div>

    <div class="footer">
      <p>本站为公益求职信息分享平台，所有内容仅作参考，不构成任何求职决策建议。</p>
      <p>站内企业评价均来源于用户公开经验分享，本站不对内容的真实性、完整性、准确性做任何保证。</p>
      <p>如企业认为相关内容侵犯自身合法权益，可通过公示的投诉渠道提交证明材料，本站将在 24 小时内核实并做下架 / 更正处理。</p>
      <p>本站与所有涉事企业均无竞争关系，发布内容仅出于就业风险提示的公益目的。</p>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal" id="modal"></div>
  </div>

<script src="data.js"></script>
<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
