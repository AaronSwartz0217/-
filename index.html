<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>杭州求职避雷网</title>
<link rel="stylesheet" href="style.css">
<script>
  // 尽早应用主题，避免加载闪烁
  (function () {
    var saved = localStorage.getItem('theme');
    var dark = saved ? saved === 'dark'
      : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>
</head>
<body class="pull">
  <div class="topbar">
    <div class="topbar-left">
      <div class="mode-switch" id="modeSwitch" data-mode="lei" role="tablist" aria-label="模式切换">
        <span class="mode-thumb"></span>
        <button class="mode-opt active" data-target="index.html" role="tab">避雷</button>
        <button class="mode-opt" data-target="novel.html" role="tab">小说</button>
      </div>
      <a class="icon-btn" href="regions.html" title="按地区筛选">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        地区筛选
      </a>
    </div>
    <button class="icon-btn" id="themeToggle">夜间模式</button>
  </div>

  <div class="wrap">
    <div class="header">
      <h1>杭州求职避雷网</h1>
      <p>输入公司名称查询，或点击左上角按地区查看避雷企业。</p>
    </div>

    <div class="search-box">
      <input id="searchInput" type="text" placeholder="输入公司名称，例如「示例」" autocomplete="off">
      <button id="searchBtn">查询</button>
    </div>

    <div class="meta">
      <span>支持模糊匹配，输入部分关键字即可</span>
      <span id="stat"></span>
    </div>

    <div class="suggest" id="suggest"></div>

    <div class="footer">
      <div id="disclaimer" class="disclaimer"></div>
      <button class="contact-link" id="contactBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        联系我们
      </button>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal" id="modal"></div>
  </div>

  <div class="agreement-overlay" id="agreementOverlay"></div>

<script src="data.js"></script>
<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
