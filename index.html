<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>杭州求职避雷网</title>
<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --text: #1a1a1a;
    --text-soft: #6b6b6b;
    --text-faint: #9a9a9a;
    --border: #e6e6e6;
    --accent: #1a1a1a;
    --danger: #d64545;
    --danger-soft: #fbeaea;
    --safe: #2f8a5b;
    --safe-soft: #eaf5ef;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }

  .wrap {
    width: 100%;
    max-width: 540px;
  }

  .header { margin-bottom: 40px; }
  .header h1 {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .header p {
    margin-top: 12px;
    color: var(--text-soft);
    font-size: 15px;
    line-height: 1.6;
  }

  .search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  #searchInput {
    flex: 1;
    padding: 14px 16px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color .15s;
  }
  #searchInput::placeholder { color: var(--text-faint); }
  #searchInput:focus { border-color: var(--accent); }
  #searchBtn {
    padding: 0 26px;
    font-size: 15px;
    font-weight: 500;
    border: none;
    border-radius: var(--radius);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: opacity .15s;
  }
  #searchBtn:hover { opacity: .85; }

  .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--text-faint);
  }

  .suggest { margin-top: 16px; }
  .suggest-item {
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 8px;
    cursor: pointer;
    font-size: 15px;
    transition: border-color .15s;
  }
  .suggest-item:hover { border-color: var(--accent); }

  /* 弹窗 */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.32);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .overlay.show { display: flex; }
  .modal {
    width: 100%;
    max-width: 480px;
    max-height: 84vh;
    overflow-y: auto;
    background: var(--surface);
    border-radius: 16px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.14);
    animation: rise .2s ease;
  }
  @keyframes rise {
    from { transform: translateY(12px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 500;
    padding: 5px 12px;
    border-radius: 20px;
    margin-bottom: 18px;
    letter-spacing: .02em;
  }
  .modal.danger .badge { background: var(--danger-soft); color: var(--danger); }
  .modal.safe .badge { background: var(--safe-soft); color: var(--safe); }
  .modal h2 {
    font-size: 21px;
    font-weight: 600;
    margin-bottom: 16px;
    letter-spacing: -0.01em;
  }
  .reason {
    font-size: 15px;
    line-height: 1.75;
    color: #333;
    padding: 16px;
    background: var(--bg);
    border-radius: 10px;
    margin-bottom: 16px;
  }
  .reason .label {
    display: block;
    font-size: 12px;
    color: var(--text-faint);
    margin-bottom: 6px;
    letter-spacing: .04em;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .tag {
    font-size: 12px;
    padding: 5px 11px;
    border-radius: 6px;
    background: var(--bg);
    color: var(--text-soft);
    border: 1px solid var(--border);
  }
  .group-note {
    font-size: 13px;
    line-height: 1.7;
    color: var(--danger);
    background: var(--danger-soft);
    padding: 14px 16px;
    border-radius: 10px;
    margin-bottom: 16px;
  }
  .group-note .label {
    display: block;
    font-size: 12px;
    color: var(--text-faint);
    margin-bottom: 6px;
    letter-spacing: .04em;
  }
  .desc {
    font-size: 15px;
    line-height: 1.75;
    color: #333;
    margin-bottom: 16px;
  }
  .desc b { font-weight: 600; }
  .close-btn {
    display: block;
    width: 100%;
    padding: 13px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    font-size: 15px;
    cursor: pointer;
    transition: background .15s;
  }
  .close-btn:hover { background: var(--bg); }

  .footer {
    margin-top: 48px;
    font-size: 12px;
    color: var(--text-faint);
    line-height: 1.8;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>杭州求职避雷网</h1>
      <p>输入公司名称，查询是否在求职黑名单中。</p>
    </div>

    <div class="search-box">
      <input id="searchInput" type="text" placeholder="输入公司名称，如「索泊」「百秋电商」" autocomplete="off">
      <button id="searchBtn">查询</button>
    </div>

    <div class="meta">
      <span>支持模糊匹配，输入部分关键字即可</span>
      <span id="stat"></span>
    </div>

    <div class="suggest" id="suggest"></div>

    <div class="footer">
      本站数据来源于网络及个人求职经历整理，仅供参考，不构成任何法律或投资建议。<br>
      如有异议，请以实际情况为准。请理性判断，谨慎求职。
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal" id="modal"></div>
  </div>

  { name: "杭州扶鲲科技有限公司", reason: "店铺托管业务工作量翻倍，同时运营多个平台，超负荷用工。", tags: ["工作量翻倍", "多平台", "超负荷"] },
  { name: "宇初电商", reason: "Temu/Shein 双平台运营，一人承担全部店铺工作，工作强度极高。", tags: ["双平台", "一人多岗", "高强度"] },
  { name: "佳兴口腔", reason: "前台岗位薪资低，轮班不规律，客诉、接待琐事繁多。", tags: ["薪资低", "轮班乱", "客诉多"] },

  { name: "两只小老虎设计", reason: "留洋老板开设，HR 虚假宣传福利、工作氛围，公司内部严重重男轻女。", tags: ["虚假宣传", "重男轻女", "氛围差"], alias: ["瞄瞄碰碰"] },

  { name: "多益网络", reason: "面试提出男女权相关刁钻奇葩问题，以价值观刁难面试者。", tags: ["面试刁难", "价值观考核", "奇葩问题"] },
  { name: "广州均利科技", reason: "专门招募无偿实习生，不发放实习补贴、劳动报酬，无偿压榨劳动力。", tags: ["无偿实习", "无报酬", "压榨"] },
  { name: "杭州联享定制家居有限公司", reason: "夫妻档小微企业，老板长期画大饼，多次承诺涨薪但从不兑现。", tags: ["画大饼", "承诺不兑现", "夫妻店"] },
  { name: "凡咔颂", reason: "工作负荷极大，日常忙碌到几乎没有上厕所、休息的空余时间。", tags: ["超高负荷", "无休息"] },
  { name: "朝禾", reason: "工作负荷极大，日常忙碌到几乎没有上厕所、休息的空余时间。", tags: ["超高负荷", "无休息"] },
  { name: "聚赢", reason: "工作负荷极大，日常忙碌到几乎没有上厕所、休息的空余时间。", tags: ["超高负荷", "无休息"] },
  { name: "漫格", reason: "工作负荷极大，日常忙碌到几乎没有上厕所、休息的空余时间。", tags: ["超高负荷", "无休息"] },
  {
    name: "杭州百秋电商",
    reason: "集中在创景路片区做跨境电商；多家主体来回分流招人，岗位职责重复，一人多岗常态化，业绩指标严苛，无偿加班现象普遍，内部人员流动极高。",
    tags: ["创景路系", "一人多岗", "无偿加班", "高流动"],
    group: "与「杭州快雅科技」「杭州三棵大树科技」为同一实际控制人企业，创景路一带同体系公司请一并避开。"
  },
  {
    name: "杭州快雅科技公司",
    reason: "集中在创景路片区做跨境电商；多家主体来回分流招人，岗位职责重复，一人多岗常态化，业绩指标严苛，无偿加班现象普遍，内部人员流动极高。",
    tags: ["创景路系", "一人多岗", "无偿加班", "高流动"],
    group: "与「杭州百秋电商」「杭州三棵大树科技」为同一实际控制人企业，创景路一带同体系公司请一并避开。"
  },
  {
    name: "杭州三棵大树科技有限公司",
    reason: "集中在创景路片区做跨境电商；多家主体来回分流招人，岗位职责重复，一人多岗常态化，业绩指标严苛，无偿加班现象普遍，内部人员流动极高。",
    tags: ["创景路系", "一人多岗", "无偿加班", "高流动"],
    group: "与「杭州百秋电商」「杭州快雅科技」为同一实际控制人企业，创景路一带同体系公司请一并避开。"
  }
];

const input = document.getElementById('searchInput');
const btn = document.getElementById('searchBtn');
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');
const suggest = document.getElementById('suggest');
const stat = document.getElementById('stat');

stat.textContent = `已收录 ${new Set(BLACKLIST.map(c => c.name)).size} 家`;

// 归一化：去除常见后缀与空白，便于模糊匹配
function normalize(s) {
  return s.replace(/\s+/g, '')
          .replace(/(有限公司|有限责任公司|股份公司|公司|集团)$/g, '')
          .toLowerCase();
}

function search(query) {
  const q = normalize(query);
  if (!q) return [];
  return BLACKLIST.filter(c => {
    const n = normalize(c.name);
    if (n.includes(q) || q.includes(n)) return true;
    if (c.alias && c.alias.some(a => normalize(a).includes(q) || q.includes(normalize(a)))) return true;
    return false;
  });
}

function showDanger(company) {
  const groupHtml = company.group
    ? `<div class="group-note"><span class="label">关联提醒</span>${company.group}</div>` : '';
  const tagsHtml = company.tags
    ? `<div class="tags">${company.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : '';
  modal.className = 'modal danger';
  modal.innerHTML = `
    <span class="badge">命中黑名单 · 建议避雷</span>
    <h2>${company.name}</h2>
    ${tagsHtml}
    <div class="reason"><span class="label">避雷原因</span>${company.reason}</div>
    ${groupHtml}
    <button class="close-btn" id="closeBtn">我知道了</button>
  `;
  openModal();
}

function showSafe(query) {
  modal.className = 'modal safe';
  modal.innerHTML = `
    <span class="badge">未命中黑名单</span>
    <h2>暂未收录「${query}」</h2>
    <div class="desc">
      未在当前黑名单中查询到该公司。但这<b>不代表该公司一定安全</b>——本站数据有限，仅收录部分被举报企业。<br><br>
      建议结合天眼查、脉脉、社交平台等多方信息综合判断，谨慎求职。
    </div>
    <button class="close-btn" id="closeBtn">好的</button>
  `;
  openModal();
}

function openModal() {
  overlay.classList.add('show');
  document.getElementById('closeBtn').onclick = closeModal;
}
function closeModal() { overlay.classList.remove('show'); }
overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };

function doSearch() {
  const query = input.value.trim();
  if (!query) { input.focus(); return; }
  const results = search(query);
  suggest.innerHTML = '';

  if (results.length === 0) {
    showSafe(query);
  } else if (results.length === 1) {
    showDanger(results[0]);
  } else {
    results.forEach(c => {
      const div = document.createElement('div');
      div.className = 'suggest-item';
      div.textContent = c.name;
      div.onclick = () => { suggest.innerHTML = ''; showDanger(c); };
      suggest.appendChild(div);
    });
  }
}

btn.onclick = doSearch;
input.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
